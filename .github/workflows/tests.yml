name: Application and security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fbt
          POSTGRES_USER: fbt
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fbt -d fbt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FBT_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_DB: fbt
      POSTGRES_USER: fbt
      POSTGRES_PASSWORD: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.lock
      - run: mkdir -p data
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests
      - run: node --test tests/offline.test.cjs
      - run: python -m compileall -q config tracker
