name: fbt
x-app: &app
  build: .
  image: fbt-pwa:local
  env_file: ${FBT_ENV_FILE:-.env}
  environment: &environment
    POSTGRES_HOST: db
    POSTGRES_DB: fbt
    POSTGRES_USER: fbt
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env using the setup guide first}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env using the setup guide first}
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fbt
      POSTGRES_USER: fbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbt -d fbt"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  init:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:${FBT_PORT:-8787}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/live/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *app
    command: ["python", "manage.py", "reminder_worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_worker"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
